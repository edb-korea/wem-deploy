---
# =============================================================================
# WEM 1.4 및 대응 구성요소 삭제 (테스트 초기화용)
#
#   ansible-playbook playbooks/wem_uninstall.yml
#
# 삭제 대상: WEM 1.4, ClickHouse, WEM 상태용 PostgreSQL, Host Agent, otelcol,
#            WHPG pg_hba.conf 의 WEM 1.4 블록, wem / wemadmin role,
#            WHPG 의 wem_remove_databases(기본 wem, 소유자와 관계없이), wem_whpg_database(wem_whpg_user 소유일 때),
#            wem_whpg_user 계정, wem_whpg_resource_group, 함께 설치된 의존 rpm (autoremove)
# 삭제하지 않는 것: WHPG 본체, WEM 1.2/1.3(Prometheus/Loki/Alloy), /etc/edb/pgaa
# 안전장치: postgres / template0 / template1 / gpadmin / 클러스터 기본 DB 는 지우지 않는다 (wem_protected_databases).
#           WEM host 의 whpg-enterprise-manager 가 wem_remove_min_version(기본 1.4) 이상일 때만 수행한다.
#           rpm 이 없거나 그보다 낮으면 아무것도 지우지 않고 끝난다.
#
# 실제 작업은 roles/warehouse-pg-wem/tasks/remove-wem14.yml, 변수는 defaults/main.yml 에 있다.
# 자세한 내용은 ansible/README.md 를 참고한다.
# =============================================================================

- name: Remove WEM 1.4 and related components
  hosts: whpg_clusters
  become: true
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: Pre-checks and placement
      ansible.builtin.import_role:
        name: warehouse-pg-wem
        tasks_from: 00-checks.yml
      tags: [always]

    - name: Remove WEM 1.4
      ansible.builtin.import_role:
        name: warehouse-pg-wem
        tasks_from: remove-wem14.yml
      tags: [remove]
